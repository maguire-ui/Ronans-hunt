name: Sync share preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-share-preview.yml"

permissions:
  contents: write

jobs:
  sync-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download share preview
        run: |
          curl -L --fail --retry 3 "https://at.adobe.com/uNP9Sz9Vm8UaSOad" -o share-preview-v1.jpg
          test -s share-preview-v1.jpg

      - name: Commit preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add share-preview-v1.jpg
          git commit -m "Add first-page share preview"
          git push
