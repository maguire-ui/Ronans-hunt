name: Sync QR1 shed photo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-qr1-scenes.yml"

permissions:
  contents: write

jobs:
  sync-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download updated shed photo
        run: |
          curl -L --fail --retry 3 "https://at.adobe.com/36gIhqwJwED3fbqv" -o qr1-placeholder.jpg
          test -s qr1-placeholder.jpg

      - name: Commit updated shed photo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qr1-placeholder.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Replace shed placeholder photo"
          git push
