name: Sync QR1 scene assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-qr1-scenes.yml"

permissions:
  contents: write

jobs:
  sync-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download QR1 map and placeholder
        run: |
          curl -L --fail --retry 3 "https://at.adobe.com/t1j2bmteyAH1Wcu8" -o qr1-map.png
          curl -L --fail --retry 3 "https://at.adobe.com/zjyMFA3xOE2Xttpl" -o qr1-placeholder.jpg
          test -s qr1-map.png
          test -s qr1-placeholder.jpg

      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qr1-map.png qr1-placeholder.jpg
          git commit -m "Add QR1 transition images"
          git push
