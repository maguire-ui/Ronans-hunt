name: Verify locked hunt QR codes

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "hunt-qr-01.svg"
      - "hunt-qr-02.svg"
      - "hunt-qr-03.svg"
      - "hunt-qr-04.svg"
      - ".github/workflows/generate-verify-qrs.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep every issued QR exactly unchanged
        run: |
          set -e
          git show 1ee019e6c844c674833c70aadac5b2deb512f8e8:hunt-qr-01.svg > /tmp/qr01.svg
          git show fb1815757201f0d79617b488845f110d5affeacb:hunt-qr-02.svg > /tmp/qr02.svg
          git show b4d32d50a059dc92b89784b1a7332def545f7997:hunt-qr-03.svg > /tmp/qr03.svg
          git show 0a982fdaddb05a397617c926b9b2040dcae610da:hunt-qr-04.svg > /tmp/qr04.svg
          cmp hunt-qr-01.svg /tmp/qr01.svg
          cmp hunt-qr-02.svg /tmp/qr02.svg
          cmp hunt-qr-03.svg /tmp/qr03.svg
          cmp hunt-qr-04.svg /tmp/qr04.svg

      - name: Ensure legacy QR02 support stays enabled
        run: |
          grep -q "LEGACY_QR2_MATRIX" index.html
          grep -q "__RONAN_LEGACY_QR02_VISUAL__" index.html
          grep -q "LEGACY_QR3_MATRIX" index.html
          grep -q "__RONAN_LEGACY_QR03_VISUAL__" index.html
          grep -q "LEGACY_QR4_MATRIX" index.html
          grep -q "__RONAN_LEGACY_QR04_VISUAL__" index.html
          echo "Original printed QR artwork is locked and QR02 fallback is present."
