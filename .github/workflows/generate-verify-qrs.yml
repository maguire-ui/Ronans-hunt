name: Verify hunt QR codes

on:
  push:
    branches: [main]
    paths:
      - "qr-tokens.txt"
      - "hunt-qr-01.svg"
      - "hunt-qr-02.svg"
      - "hunt-qr-03.svg"
      - "hunt-qr-04.svg"
      - ".github/workflows/generate-verify-qrs.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install QR verification tools
        run: |
          python -m pip install --quiet zxing-cpp pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin

      - name: Verify every existing QR without changing it
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import subprocess, zxingcpp

          entries=[]
          for raw in Path("qr-tokens.txt").read_text().splitlines():
              if not raw.strip():
                  continue
              filename, token = raw.split("\t", 1)
              entries.append((filename.strip(), token.strip()))

          for filename, expected in entries:
              png=f"/tmp/{filename[:-4]}.png"
              subprocess.run(
                  ["rsvg-convert","-w","1220","-h","1400",filename,"-o",png],
                  check=True
              )
              img=Image.open(png)
              code=zxingcpp.read_barcode(img)
              decoded=code.text if code else ""
              if decoded != expected:
                  raise SystemExit(
                      f"{filename} FAILED: expected {expected!r}, decoded {decoded!r}"
                  )
              print(f"Verified {filename}: {decoded}")
          PY
