name: Decode legacy hunt QRs
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/decode-legacy-qrs.yml"
permissions:
  contents: write
jobs:
  decode:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin zbar-tools
      - name: Decode legacy QR files
        run: |
          set -e
          : > legacy-qr-tokens.txt
          for f in tmp-old-qr01.svg tmp-old-qr02.svg; do
            png="/tmp/${f%.svg}.png"
            rsvg-convert -w 1220 -h 1400 "$f" -o "$png"
            token="$(zbarimg --quiet -Sqr.enable --raw "$png" | head -n1)"
            test -n "$token"
            printf '%s\t%s\n' "$f" "$token" >> legacy-qr-tokens.txt
          done
          cat legacy-qr-tokens.txt
      - name: Commit decoded tokens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy-qr-tokens.txt
          git commit -m "Decode legacy printed QR tokens"
          git push
