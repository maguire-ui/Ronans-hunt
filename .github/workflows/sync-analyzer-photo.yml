name: Sync analyzer clue photo
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-analyzer-photo.yml"
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download analyzer clue photo
        run: |
          curl -L --fail --retry 3 "https://at.adobe.com/Be4O5zSYNPoHRNks" -o analyzer-photo-01.jpg
          test -s analyzer-photo-01.jpg
      - name: Commit photo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analyzer-photo-01.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add first analyzer clue photo"
          git push
