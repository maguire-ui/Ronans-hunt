<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#9ab4c9" />
  <title>Ronan Hunt</title>
  <style>
    :root {
      --ink: #0c1720;
      --mist: rgba(255,255,255,.86);
      --glass: rgba(255,255,255,.22);
      --glass-line: rgba(255,255,255,.42);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: ui-rounded, "SF Pro Rounded", "SF Pro Display", Inter, system-ui, -apple-system, sans-serif;
      background: #0b1824;
      color: white;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    .scene {
      position: fixed;
      inset: 0;
      isolation: isolate;
      background:
        radial-gradient(circle at 50% 42%, rgba(207, 232, 244, .4), transparent 34%),
        linear-gradient(180deg, #89a9be 0%, #708fa5 46%, #536d80 100%);
    }

    .underlay {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 32%, rgba(185, 220, 255, .3), transparent 32%),
        linear-gradient(180deg, #1c3347 0%, #142939 52%, #0a1823 100%);
    }

    .underlay::before {
      content: "";
      position: absolute;
      inset: auto -15% -8% -15%;
      height: 47%;
      background:
        radial-gradient(ellipse at 14% 100%, #07131a 0 48%, transparent 49%),
        radial-gradient(ellipse at 36% 100%, #091822 0 52%, transparent 53%),
        radial-gradient(ellipse at 62% 100%, #07151e 0 50%, transparent 51%),
        radial-gradient(ellipse at 88% 100%, #081721 0 56%, transparent 57%);
      opacity: .9;
      filter: blur(1px);
    }

    .underlay::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,.7) 0 1px, transparent 1.5px),
        radial-gradient(circle at 78% 22%, rgba(255,255,255,.55) 0 1px, transparent 1.5px),
        radial-gradient(circle at 66% 10%, rgba(255,255,255,.42) 0 1px, transparent 1.5px);
      opacity: .7;
    }


    .map-stage {
      position: absolute;
      inset: 0;
      z-index: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 35%, rgba(255,255,255,.5), transparent 32%),
        linear-gradient(180deg, #e3e4cf 0%, #cfd5b7 100%);
    }

    .map-card {
      position: relative;
      width: 100vw;
      height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .map-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .map-old {
      z-index: 1;
      opacity: 0;
      transform: scale(1.012);
      transition:
        opacity 2.5s cubic-bezier(.22,.8,.25,1),
        transform 2.5s cubic-bezier(.22,.8,.25,1);
    }

    .map-qr {
      z-index: 2;
      opacity: 0;
      transform-origin: 0 0;
      transform: translate(0, 0) scale(1);
      transition:
        opacity 2.5s cubic-bezier(.22,.8,.25,1),
        transform 2.2s cubic-bezier(.2,.72,.2,1);
    }

    .map-placeholder {
      z-index: 3;
      opacity: 0;
      object-fit: cover;
      object-position: center center;
      transform: scale(1.01);
      transition:
        opacity 2.2s cubic-bezier(.22,.8,.25,1),
        transform 2.2s cubic-bezier(.22,.8,.25,1);
    }

    .scene.unlocking .map-old,
    .scene.unlocked .map-old {
      opacity: 1;
      transform: scale(1);
    }

    .scene.qr-map-in .map-old {
      opacity: 0;
      transform: scale(.99);
    }

    .scene.qr-map-in .map-qr {
      opacity: 1;
    }

    .scene.qr-map-zoom .map-qr {
      transform:
        translate(var(--qr-dx, 0px), var(--qr-dy, 0px))
        scale(var(--qr-scale, 4.1));
    }

    .scene.qr-placeholder-in .map-qr {
      opacity: 0;
    }

    .scene.qr-placeholder-in .map-placeholder {
      opacity: 1;
      transform: scale(1);
    }

    .map-card.focus-x .map-old {
      transform-origin: var(--focus-origin-x, 50%) var(--focus-origin-y, 50%);
      animation: focusOnX 3s cubic-bezier(.22,.72,.2,1) both;
    }

    @keyframes focusOnX {
      0% {
        transform: translate(0, 0) scale(1);
      }
      33.333% {
        transform: translate(var(--focus-dx, 0px), var(--focus-dy, 0px)) scale(2.25);
      }
      66.667% {
        transform: translate(var(--focus-dx, 0px), var(--focus-dy, 0px)) scale(2.25);
      }
      100% {
        transform: translate(0, 0) scale(1);
      }
    }

    .clouds {
      position: absolute;
      inset: -12vmax;
      z-index: 3;
      pointer-events: none;
      filter: saturate(.92);
    }

    .cloud {
      --scale: 1;
      --opacity: .9;
      --blur: 0px;
      --drift: 16s;
      --delay: 0s;
      position: absolute;
      width: 210px;
      height: 92px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(232,239,243,.9));
      opacity: var(--opacity);
      filter: blur(var(--blur));
      transform: translate(-50%, -50%) scale(var(--scale));
      box-shadow:
        0 22px 36px rgba(43, 61, 74, .14),
        inset 0 -10px 18px rgba(180, 195, 205, .18);
      animation: drift var(--drift) ease-in-out var(--delay) infinite alternate;
      will-change: transform, opacity, filter;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }
    .cloud::before {
      width: 102px;
      height: 102px;
      left: 30px;
      top: -42px;
    }
    .cloud::after {
      width: 128px;
      height: 128px;
      right: 21px;
      top: -57px;
    }

    @keyframes drift {
      from { transform: translate(calc(-50% - 7px), calc(-50% + 1px)) scale(var(--scale)); }
      to   { transform: translate(calc(-50% + 7px), calc(-50% - 3px)) scale(var(--scale)); }
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 26%, rgba(18, 33, 44, .08) 64%, rgba(10, 18, 24, .24) 100%);
      mix-blend-mode: multiply;
    }

    .login {
      position: absolute;
      inset: 0;
      z-index: 7;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
      transition: opacity .45s ease, transform .55s cubic-bezier(.2,.9,.25,1), filter .45s ease;
    }

    .login-inner {
      width: min(88vw, 420px);
      text-align: center;
      transform: translateY(-1vh);
    }

    .eyebrow {
      margin: 0 0 8px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: rgba(14, 30, 41, .65);
      text-shadow: 0 1px 2px rgba(255,255,255,.45);
    }

    h1 {
      margin: 0 0 28px;
      font-size: clamp(52px, 12.7vw, 88px);
      line-height: .92;
      letter-spacing: -.055em;
      font-weight: 850;
      color: #10212d;
      text-wrap: balance;
      text-shadow:
        0 1px 0 rgba(255,255,255,.55),
        0 4px 18px rgba(255,255,255,.28),
        0 16px 45px rgba(17,31,41,.15);
    }

    .code-wrap {
      width: min(330px, 100%);
      margin: 0 auto;
    }

    .code-shell {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 7px 7px 17px;
      border-radius: 22px;
      background: rgba(255,255,255,.35);
      border: 1px solid rgba(255,255,255,.58);
      box-shadow:
        0 12px 34px rgba(16, 30, 40, .16),
        inset 0 1px 0 rgba(255,255,255,.5);
      backdrop-filter: blur(18px) saturate(1.15);
      -webkit-backdrop-filter: blur(18px) saturate(1.15);
      transition: transform .22s ease, background .22s ease, box-shadow .22s ease;
    }

    .code-shell:focus-within {
      transform: translateY(-2px);
      background: rgba(255,255,255,.47);
      box-shadow:
        0 16px 42px rgba(16, 30, 40, .2),
        0 0 0 4px rgba(255,255,255,.15),
        inset 0 1px 0 rgba(255,255,255,.58);
    }

    input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: #10212d;
      font: inherit;
      font-size: 22px;
      font-weight: 780;
      letter-spacing: .18em;
      text-align: left;
      caret-color: #10212d;
      -webkit-user-select: text;
      user-select: text;
    }

    input::placeholder {
      color: rgba(16,33,45,.5);
      letter-spacing: .01em;
      font-size: 15px;
      font-weight: 700;
    }

    button {
      width: 50px;
      height: 50px;
      flex: 0 0 50px;
      border: 0;
      border-radius: 17px;
      background: #10212d;
      color: white;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(15,30,40,.22);
      transition: transform .16s ease, background .16s ease;
    }
    button:active { transform: scale(.93); }
    button svg { width: 22px; height: 22px; }

    .message {
      min-height: 24px;
      margin-top: 10px;
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .01em;
      color: rgba(18,35,46,.75);
      text-shadow: 0 1px 1px rgba(255,255,255,.35);
      opacity: 0;
      transform: translateY(-4px);
      transition: .2s ease;
    }
    .message.show { opacity: 1; transform: translateY(0); }

    .shake { animation: shake .42s cubic-bezier(.36,.07,.19,.97); }
    @keyframes shake {
      10%, 90% { transform: translateX(-2px); }
      20%, 80% { transform: translateX(4px); }
      30%, 50%, 70% { transform: translateX(-7px); }
      40%, 60% { transform: translateX(7px); }
    }

    .shockwave {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 10vmin;
      aspect-ratio: 1;
      z-index: 6;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.48);
      box-shadow: 0 0 40px rgba(255,255,255,.26), inset 0 0 35px rgba(255,255,255,.14);
      transform: translate(-50%, -50%) scale(.1);
      opacity: 0;
      pointer-events: none;
    }

    .scene.unlocking .login {
      opacity: 0;
      transform: scale(.92);
      filter: blur(8px);
      pointer-events: none;
    }

    .scene.unlocking .shockwave {
      animation: shock 1.6s cubic-bezier(.15,.75,.1,1) forwards;
    }

    @keyframes shock {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.2); }
      14% { opacity: .85; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(16); }
    }

    .scene.unlocking .cloud {
      animation: clearCloud var(--clear-duration, 2150ms) cubic-bezier(.4,0,.2,1) var(--clear-delay, 0ms) forwards !important;
    }

    @keyframes clearCloud {
      0% {
        transform: translate(-50%, -50%) scale(var(--scale));
        opacity: var(--opacity);
        filter: blur(var(--blur));
      }
      28% { opacity: var(--opacity); }
      100% {
        transform:
          translate(calc(-50% + var(--dx)), calc(-50% + var(--dy)))
          scale(calc(var(--scale) * 1.18))
          rotate(var(--rot));
        opacity: 0;
        filter: blur(calc(var(--blur) + 5px));
      }
    }

    .scene.unlocked .clouds,
    .scene.unlocked .vignette,
    .scene.unlocked .login,
    .scene.unlocked .shockwave { display: none; }

    .scan-cta{position:absolute;z-index:9;left:50%;bottom:max(28px,calc(env(safe-area-inset-bottom) + 16px));width:auto;min-width:190px;height:56px;padding:0 22px;transform:translate(-50%,18px) scale(.96);opacity:0;pointer-events:none;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:850;letter-spacing:-.01em;background:#10212d;color:white;box-shadow:0 14px 38px rgba(8,20,28,.28);transition:opacity .45s ease,transform .55s cubic-bezier(.2,.9,.25,1)}
    .scan-cta.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
    .scan-cta svg{width:21px;height:21px}
    .scanner-overlay{position:absolute;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;padding:18px 16px max(16px,env(safe-area-inset-bottom));background:rgba(7,16,22,.68);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
    .scanner-overlay.open{display:flex}
    .scanner-sheet{width:min(100%,520px);max-height:min(88dvh,720px);overflow:auto;border-radius:28px;padding:18px;background:#f4f0e7;color:#10212d;box-shadow:0 28px 90px rgba(0,0,0,.38)}
    .scanner-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    .scanner-title{margin:0;font-size:23px;line-height:1;letter-spacing:-.03em}
    .scanner-close{width:44px;height:44px;flex:0 0 44px;border-radius:15px;background:rgba(16,33,45,.09);color:#10212d;box-shadow:none;font-size:24px;font-weight:700}
    #qr-reader{width:100%;min-height:280px;overflow:hidden;border-radius:22px;background:#111a15}
    #qr-reader video,#qr-reader canvas{width:100%!important;max-height:56dvh;object-fit:cover;border-radius:22px}
    .scan-status{margin:14px 4px 10px;min-height:22px;font-size:14px;line-height:1.4;font-weight:750;color:rgba(16,33,45,.72);text-align:center}
    .scan-status.success{color:#1e6b39}.scan-status.error{color:#9b2c22}
    .photo-pick{min-height:48px;border-radius:16px;border:1px solid rgba(16,33,45,.16);display:flex;align-items:center;justify-content:center;padding:12px 16px;font-size:14px;font-weight:800;cursor:pointer;background:rgba(255,255,255,.62)}
    .photo-pick input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

    .tiny-mark {
      position: absolute;
      z-index: 1;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      font-size: 10px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: rgba(17,35,46,.38);
      opacity: 0;
      transition: opacity .8s ease 1.5s;
    }
    .scene.unlocked .tiny-mark { opacity: 1; }

    @media (max-width: 520px) {
      .cloud { width: 158px; height: 70px; }
      .cloud::before { width: 78px; height: 78px; left: 22px; top: -33px; }
      .cloud::after { width: 98px; height: 98px; right: 15px; top: -44px; }
      .login-inner { transform: translateY(-3vh); }
      h1 { margin-bottom: 24px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cloud { animation: none; }
      .scene.unlocking .cloud { animation-duration: 350ms !important; animation-delay: 0ms !important; }
      .scene.unlocking .shockwave { animation-duration: 400ms; }
      .map-photo { transition: none; }
      .map-card.focus-x .map-old { animation: none; }
    }
  </style>
</head>
<body>
  <main class="scene" id="scene" aria-label="Ronan Hunt password screen">
    <div class="map-stage">
      <div class="map-card">
        <img id="oldMap" class="map-photo map-old" src="./carson-map.png?v=redx3" alt="Illustrated neighborhood scavenger hunt map" />
        <img id="qrMap" class="map-photo map-qr" src="./qr1-map.png?v=1" alt="Illustrated neighborhood map for the first QR clue" />
        <img id="placeholderMap" class="map-photo map-placeholder" src="./qr1-placeholder.jpg?v=1" alt="Placeholder close-up scene for the next hunt step" />
      </div>
    </div>
    <div class="tiny-mark" aria-hidden="true">Map unlocked</div>

    <button class="scan-cta" id="scanCta" type="button" aria-label="Scan the next hunt QR code">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 8h3v3H8V8Zm5 0h3v3h-3V8Zm-5 5h3v3H8v-3Zm5 0h1.5v1.5H13V13Zm2 2h1v1h-1v-1Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="scanCtaText">Scan Next QR</span>
    </button>
    <div class="scanner-overlay" id="scannerOverlay" aria-hidden="true">
      <section class="scanner-sheet" role="dialog" aria-modal="true" aria-labelledby="scannerTitle">
        <div class="scanner-head"><h2 class="scanner-title" id="scannerTitle">Scan hunt code</h2><button class="scanner-close" id="scannerClose" type="button" aria-label="Close scanner">×</button></div>
        <div id="qr-reader"></div>
        <p class="scan-status" id="scanStatus">Point the camera at the Ronan Hunt QR code.</p>
        <label class="photo-pick">Scan from a photo<input id="qrFile" type="file" accept="image/*" /></label>
      </section>
    </div>
    <div class="clouds" id="clouds" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="shockwave" aria-hidden="true"></div>

    <section class="login" id="login">
      <div class="login-inner">
        <p class="eyebrow">Private scavenger hunt</p>
        <h1>Ronan Hunt</h1>
        <form class="code-wrap" id="codeForm" autocomplete="off">
          <div class="code-shell" id="codeShell">
            <input
              id="codeInput"
              type="password"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="6"
              autocomplete="off"
              enterkeyhint="go"
              aria-label="Enter the six digit password"
              placeholder="Enter password"
            />
            <button type="submit" aria-label="Unlock hunt">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
          <div class="message" id="message">That code isn’t right.</div>
        </form>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    (() => {
      const scene = document.getElementById('scene');
      const cloudField = document.getElementById('clouds');
      const form = document.getElementById('codeForm');
      const input = document.getElementById('codeInput');
      const shell = document.getElementById('codeShell');
      const message = document.getElementById('message');
      const scanCta = document.getElementById('scanCta');
      const scanCtaText = document.getElementById('scanCtaText');
      const scannerOverlay = document.getElementById('scannerOverlay');
      const scannerClose = document.getElementById('scannerClose');
      const scanStatus = document.getElementById('scanStatus');
      const qrFile = document.getElementById('qrFile');
      const mapCard = document.querySelector('.map-card');
      const oldMap = document.getElementById('oldMap');
      const qrMap = document.getElementById('qrMap');
      const placeholderMap = document.getElementById('placeholderMap');
      const mapImage = oldMap;
      const PASSWORD = '713489';
      const X_IMAGE_X = 0.3415;
      const X_IMAGE_Y = 0.3763;
      const QR_TARGET_X = 0.155;
      const QR_TARGET_Y = 0.752;
      const QR_TARGET_SCALE = 4.1;
      const PROGRESS_KEY = 'ronanHuntProgressV2';
      const NEXT_QR = 'RONAN-HUNT|STAGE-2|8D7K-PINE-42M';
      const params = new URLSearchParams(location.search);
      const resumeQr1 = params.get('resume') === 'qr1';
      let unlocked = false;
      let qrScanner = null;
      let scannerRunning = false;
      let qrSolved = false;

      // Dense, full-screen cloud cover — intentionally no empty center around the title.
      const cloudLayout = [
        [3,3,1.32,.94,1],[17,1,1.05,.88,0],[31,5,1.28,.93,1],[47,0,1.16,.92,0],[62,4,1.42,.94,1],[80,1,1.14,.90,0],[96,4,1.35,.95,1],
        [8,14,1.12,.93,0],[23,17,1.38,.96,1],[40,13,1.18,.91,0],[55,17,1.28,.97,1],[73,13,1.36,.92,0],[90,17,1.2,.95,1],
        [0,29,1.35,.97,1],[16,28,1.25,.92,0],[33,31,1.48,.98,1],[50,27,1.30,.96,0],[67,31,1.44,.97,1],[84,27,1.26,.94,0],[101,31,1.45,.98,1],
        [7,43,1.24,.95,0],[23,47,1.42,.98,1],[40,42,1.26,.97,0],[56,46,1.54,.99,1],[73,41,1.34,.96,0],[91,46,1.42,.98,1],
        [0,60,1.44,.98,1],[17,59,1.34,.96,0],[34,63,1.52,.99,1],[51,58,1.32,.97,0],[68,62,1.45,.98,1],[85,58,1.30,.96,0],[101,62,1.46,.99,1],
        [7,76,1.28,.96,0],[24,79,1.46,.99,1],[41,75,1.34,.97,0],[58,80,1.48,.99,1],[75,75,1.34,.96,0],[93,79,1.47,.99,1],
        [1,94,1.42,.98,1],[18,92,1.25,.95,0],[35,96,1.48,.99,1],[52,91,1.32,.97,0],[70,96,1.42,.98,1],[87,92,1.30,.96,0],[102,96,1.44,.98,1]
      ];

      function seeded(n) {
        const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453;
        return x - Math.floor(x);
      }

      cloudLayout.forEach((c, i) => {
        const el = document.createElement('div');
        el.className = 'cloud';
        el.style.left = `${c[0]}%`;
        el.style.top = `${c[1]}%`;
        el.style.setProperty('--scale', c[2]);
        el.style.setProperty('--opacity', c[3]);
        el.style.setProperty('--blur', c[4] ? '1.2px' : '.2px');
        el.style.setProperty('--drift', `${14 + seeded(i) * 9}s`);
        el.style.setProperty('--delay', `${-seeded(i + 30) * 9}s`);
        cloudField.appendChild(el);
      });

      function prepClearAnimation() {
        const rect = scene.getBoundingClientRect();
        const cx = rect.width / 2;
        const cy = rect.height / 2;
        const maxDistance = Math.hypot(cx, cy);

        [...cloudField.children].forEach((cloud, index) => {
          const r = cloud.getBoundingClientRect();
          const x = r.left + r.width / 2;
          const y = r.top + r.height / 2;
          let vx = x - cx;
          let vy = y - cy;
          let dist = Math.hypot(vx, vy);

          if (dist < 32) {
            const a = seeded(index + 80) * Math.PI * 2;
            vx = Math.cos(a) * 32;
            vy = Math.sin(a) * 32;
            dist = 32;
          }

          const nx = vx / dist;
          const ny = vy / dist;
          const travel = Math.max(rect.width, rect.height) * (0.74 + seeded(index + 130) * .22);
          const normalized = Math.min(1, dist / maxDistance);
          const delay = Math.round(normalized * 580 + seeded(index + 160) * 90);
          const duration = Math.round(1900 + seeded(index + 190) * 550);

          cloud.style.setProperty('--dx', `${nx * travel}px`);
          cloud.style.setProperty('--dy', `${ny * travel}px`);
          cloud.style.setProperty('--rot', `${(seeded(index + 220) - .5) * 10}deg`);
          cloud.style.setProperty('--clear-delay', `${delay}ms`);
          cloud.style.setProperty('--clear-duration', `${duration}ms`);
        });
      }

      function prepXFocus() {
        const r = mapImage.getBoundingClientRect();
        const imageRatio = mapImage.naturalWidth / mapImage.naturalHeight;
        const boxRatio = r.width / r.height;

        let shownWidth;
        let shownHeight;
        let offsetX = 0;
        let offsetY = 0;

        if (imageRatio > boxRatio) {
          shownWidth = r.width;
          shownHeight = r.width / imageRatio;
          offsetY = (r.height - shownHeight) / 2;
        } else {
          shownHeight = r.height;
          shownWidth = r.height * imageRatio;
          offsetX = (r.width - shownWidth) / 2;
        }

        const xLocal = offsetX + shownWidth * X_IMAGE_X;
        const yLocal = offsetY + shownHeight * X_IMAGE_Y;
        const dx = r.width / 2 - xLocal;
        const dy = r.height / 2 - yLocal;

        mapImage.style.setProperty('--focus-origin-x', `${xLocal}px`);
        mapImage.style.setProperty('--focus-origin-y', `${yLocal}px`);
        mapImage.style.setProperty('--focus-dx', `${dx}px`);
        mapImage.style.setProperty('--focus-dy', `${dy}px`);
      }

      function prepQrMapZoom() {
        const r = qrMap.getBoundingClientRect();
        if (!qrMap.naturalWidth || !qrMap.naturalHeight || !r.width || !r.height) return;

        const imageRatio = qrMap.naturalWidth / qrMap.naturalHeight;
        const boxRatio = r.width / r.height;
        let shownWidth;
        let shownHeight;
        let offsetX = 0;
        let offsetY = 0;

        if (imageRatio > boxRatio) {
          shownWidth = r.width;
          shownHeight = r.width / imageRatio;
          offsetY = (r.height - shownHeight) / 2;
        } else {
          shownHeight = r.height;
          shownWidth = r.height * imageRatio;
          offsetX = (r.width - shownWidth) / 2;
        }

        const targetX = offsetX + shownWidth * QR_TARGET_X;
        const targetY = offsetY + shownHeight * QR_TARGET_Y;
        const dx = r.width / 2 - targetX * QR_TARGET_SCALE;
        const dy = r.height / 2 - targetY * QR_TARGET_SCALE;

        qrMap.style.setProperty('--qr-dx', `${dx}px`);
        qrMap.style.setProperty('--qr-dy', `${dy}px`);
        qrMap.style.setProperty('--qr-scale', QR_TARGET_SCALE);
      }

      function runQrSequence() {
        prepQrMapZoom();
        scene.classList.remove('qr-map-in', 'qr-map-zoom', 'qr-placeholder-in');
        void scene.offsetWidth;

        setTimeout(() => {
          scene.classList.add('qr-map-in');
        }, 120);

        setTimeout(() => {
          prepQrMapZoom();
          scene.classList.add('qr-map-zoom');
        }, 2700);

        setTimeout(() => {
          scene.classList.add('qr-placeholder-in');
        }, 5800);
      }

      function focusOnX() {
        prepXFocus();
        mapCard.classList.remove('focus-x');
        void mapCard.offsetWidth;
        mapCard.classList.add('focus-x');
        setTimeout(()=>{
          mapCard.classList.remove('focus-x');
          updateScanButton();
          scanCta.classList.add('show');
        },3050);
      }


      function currentProgress(){return Number(localStorage.getItem(PROGRESS_KEY)||'1');}
      function updateScanButton(){
        scanCtaText.textContent='Scan Next QR';
        scanCta.setAttribute('aria-label','Scan the next hunt QR code');
      }
      async function stopScanner(){
        if(!qrScanner||!scannerRunning)return;
        try{await qrScanner.stop();}catch(_){}
        scannerRunning=false;
      }
      async function closeScanner(){
        await stopScanner();
        scannerOverlay.classList.remove('open');
        scannerOverlay.setAttribute('aria-hidden','true');
        scanStatus.className='scan-status';
        scanStatus.textContent='Point the camera at the Ronan Hunt QR code.';
      }
      async function unlockFromQr(decodedText){
        if(qrSolved)return;
        if((decodedText||'').trim()!==NEXT_QR){
          scanStatus.className='scan-status error';
          scanStatus.textContent='That is not the next Ronan Hunt code.';
          return;
        }
        qrSolved=true;
        await stopScanner();
        localStorage.setItem(PROGRESS_KEY,'2');
        scanStatus.className='scan-status success';
        scanStatus.textContent='Code accepted — map unlocked.';
        scannerOverlay.classList.remove('open');
        scannerOverlay.setAttribute('aria-hidden','true');
        scanCta.classList.remove('show');
        runQrSequence();
      }
      async function openScanner(){
        scannerOverlay.classList.add('open');
        scannerOverlay.setAttribute('aria-hidden','false');
        scanStatus.className='scan-status';
        scanStatus.textContent='Allow camera access, then point it at the hunt QR code.';
        qrSolved=false;
        if(typeof Html5Qrcode==='undefined'){
          scanStatus.className='scan-status error';
          scanStatus.textContent='The QR scanner did not load. Refresh and try again.';
          return;
        }
        if(!qrScanner)qrScanner=new Html5Qrcode('qr-reader');
        try{
          await qrScanner.start({facingMode:'environment'},{fps:12,qrbox:{width:245,height:245},aspectRatio:1},unlockFromQr,()=>{});
          scannerRunning=true;
          scanStatus.textContent='Point the camera at the Ronan Hunt QR code.';
        }catch(_){
          scannerRunning=false;
          scanStatus.className='scan-status error';
          scanStatus.textContent='Camera could not start. You can scan from a photo below.';
        }
      }

      function rejectCode() {
        shell.classList.remove('shake');
        void shell.offsetWidth;
        shell.classList.add('shake');
        message.classList.add('show');
        setTimeout(() => message.classList.remove('show'), 1450);
      }

      function unlock() {
        if (unlocked) return;
        unlocked = true;
        input.blur();
        input.disabled = true;
        prepClearAnimation();
        requestAnimationFrame(() => scene.classList.add('unlocking'));
        setTimeout(focusOnX, 2450);
        setTimeout(() => {
          scene.classList.remove('unlocking');
          scene.classList.add('unlocked');
        }, 3250);
      }

      function checkCode() {
        const value = input.value.replace(/\D/g, '').slice(0, 6);
        input.value = value;
        if (value.length < 6) return;
        if (value === PASSWORD) unlock();
        else rejectCode();
      }

      scanCta.addEventListener('click',openScanner);
      scannerClose.addEventListener('click',closeScanner);
      scannerOverlay.addEventListener('click',(event)=>{if(event.target===scannerOverlay)closeScanner();});
      qrFile.addEventListener('change',async()=>{
        const file=qrFile.files&&qrFile.files[0];
        if(!file||typeof Html5Qrcode==='undefined')return;
        await stopScanner();
        if(!qrScanner)qrScanner=new Html5Qrcode('qr-reader');
        try{
          const decodedText=await qrScanner.scanFile(file,true);
          await unlockFromQr(decodedText);
        }catch(_){
          scanStatus.className='scan-status error';
          scanStatus.textContent='I could not read a QR code from that photo.';
        }finally{qrFile.value='';}
      });

      input.addEventListener('input', () => {
        input.value = input.value.replace(/\D/g, '').slice(0, 6);
        message.classList.remove('show');
      });

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        if (input.value === PASSWORD) unlock();
        else rejectCode();
      });

      window.addEventListener('resize', () => {
        if (!unlocked) return;
        prepClearAnimation();
        if (mapImage.complete) prepXFocus();
        if (qrMap.complete) prepQrMapZoom();
      }, { passive: true });

      if (mapImage.complete) prepXFocus();
      else mapImage.addEventListener('load', prepXFocus, { once: true });

      if (qrMap.complete) prepQrMapZoom();
      else qrMap.addEventListener('load', prepQrMapZoom, { once: true });

      if (resumeQr1) {
        try { localStorage.setItem(PROGRESS_KEY, '2'); } catch (_) {}
        unlocked = true;
        scene.classList.add('unlocked');
        scanCta.classList.remove('show');
        setTimeout(runQrSequence, 250);
        history.replaceState({}, '', location.pathname);
      }
    })();
  </script>
</body>
